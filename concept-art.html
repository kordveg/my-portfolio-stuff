<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Concept Art | My Portfolio</title> 
    <!-- Real, Verified Google Fonts Link for JetBrains Mono --> 
    <link rel="preconnect" href="https://googleapis.com"> 
    <link rel="preconnect" href="https://gstatic.com" crossorigin> 
    <link href="https://googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet"> 
    <link rel="stylesheet" href="style.css"> 
</head> 
<body> 
    <!-- Navigation Header --> 
    <header class="main-header"> 
        <nav class="nav-links"> 
            <a href="index.html">Back to Home</a> 
        </nav> 
        <!-- Theme Toggle Switch --> 
        <div class="theme-switch-container"> 
            <button id="theme-toggle" aria-label="Toggle dark and light mode"> 
                <span class="switch-handle"></span> 
            </button> 
        </div> 
    </header> 

    <!-- Main Content Section --> 
    <section class="portfolio-section"> 
        <h2>Concept Art</h2> 
        <p>Character turnarounds and visual development.</p> 

        <!-- Replaced placeholders with your masonry layout container -->
        <div class="gallery-container masonry-stream"> 
            
            <!-- Work 1: Hazed Dayz -->
            <div class="gallery-card">
                <img src="https://imgur.com" alt="Fritz Ackermann illustration" class="zoomable-img" loading="lazy">
                <div class="gallery-overlay">
                    <h3>Hazed Dayz</h3>
                </div>
            </div>

            <!-- Work 2: When The Sun Hits -->
            <div class="gallery-card">
                <img src="https://imgur.com" alt="Character on rooftop illustration" class="zoomable-img" loading="lazy">
                <div class="gallery-overlay">
                    <h3>When The Sun Hits</h3>
                </div>
            </div>

            <!-- Work 3: Turbine Collision -->
            <div class="gallery-card">
                <img src="https://imgur.com" alt="Wind turbines collision" class="zoomable-img" loading="lazy">
                <div class="gallery-overlay">
                    <h3>Turbine Collision</h3>
                </div>
            </div>

            <!-- Work 4: Sonder -->
            <div class="gallery-card">
                <img src="https://imgur.com" alt="Characters indoors illustration" class="zoomable-img" loading="lazy">
                <div class="gallery-overlay">
                    <h3>Sonder</h3>
                </div>
            </div>

            <!-- Work 5: A Walk -->
            <div class="gallery-card">
                <img src="https://imgur.com" alt="Characters walking in woods" class="zoomable-img" loading="lazy">
                <div class="gallery-overlay">
                    <h3>A Walk</h3>
                </div>
            </div>

        </div> 
    </section> 

    <!-- UNIVERSAL LIGHTBOX ZOOM MODAL CONTAINER (Aligned with your style.css line 454) -->
    <div id="imageZoomModal" class="lightbox-modal">
        <span class="close-zoom" style="position: absolute; top: 20px; right: 30px; color: #888; font-size: 35px; cursor: pointer;">&times;</span>
        <img class="lightbox-content" id="zoomedImage" alt="Zoomed view">
    </div>

    <!-- Universal Footer --> 
    <footer class="site-footer"> 
        <p class="footer-credits">© 2026 Built by yours truly</p> 
    </footer> 

    <!-- Script to handle light/dark logic --> 
    <script src="script.js"></script> 
</body> 
</html>
