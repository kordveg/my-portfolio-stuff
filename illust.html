  <!-- 🛠️ INJECTED LAYOUT TUNING FOR FREE-FLOWING IMAGE DUMP -->
  <style>
    /* Creates a true masonry stream layout where content flows organically */
    .illust-container {
      column-count: 2;
      column-gap: 20px;
      width: 100%;
      margin-top: 20px;
    }

    /* Target smaller screens to stack down to a single column cleanly */
    @media (max-width: 768px) {
      .illust-container {
        column-count: 1;
      }
    }

    /* Prevents the card wrapper from splitting or clipping across column seams */
    .illust-card {
      position: relative;
      display: inline-block;
      width: 100%;
      margin-bottom: 20px;
      overflow: hidden;
      border: 1px solid var(--border-color, #333);
      border-radius: 4px;
      background: transparent;
    }

    /* Allows images to maintain their exact native aspect ratios with no cropping */
    .illust-card img {
      width: 100%;
      height: auto;
      display: block;
      transition: transform 0.3s ease;
    }

    /* Scale up artwork on hover */
    .illust-card:hover img {
      transform: scale(1.02);
    }

    /* Hidden title overlay that fades up cleanly over the native canvas bounds */
    .illust-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 20px 15px 15px 15px;
      background: linear-gradient(transparent, rgba(0, 0, 0, 0.85));
      opacity: 0;
      transition: opacity 0.25s ease;
      pointer-events: none; /* Stops it from messing up click-to-zoom */
      box-sizing: border-box;
    }

    .illust-card:hover .illust-overlay {
      opacity: 1;
    }

    .illust-overlay h3 {
      margin: 0;
      padding: 0;
      color: #fff;
      font-size: 1rem;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 500;
      line-height: 1.2;
    }
  </style>
