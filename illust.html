<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Illustrations | My Portfolio</title>
  
  <!-- Google Fonts Link for JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">
  
  <!-- Core Stylesheet Connection -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navigation Header -->
  <header class="main-header">
    <nav class="nav-links">
      <a href="index.html">Back to Home</a>
    </nav>
    
    <!-- Theme Toggle Switch -->
    <div class="theme-switch-container">
      <button id="theme-toggle" aria-label="Toggle dark and light mode">
        <span class="switch-handle"></span>
      </button>
    </div>
  </header>

  <!-- Main Content Section -->
  <section class="portfolio-section">
    <h2>Illustrations</h2>
    <p>Polished digital and traditional media.</p>
  </section>

  <!-- Gallery Wall Collage Section -->
  <section class="portfolio-section" style="margin-top: 40px;">
    
    <!-- 🎯 THE FREE-FLOWING COLLAGE CONTAINER -->
    <div class="illust-container">

      <!-- Work 1: Hazed Dayz -->
      <div class="gallery-card illust-card">
        <div class="image-placeholder">
          <img src="https://i.imgur.com/4g1VaDt.png" alt="Fritz Ackermann, in a day-drunken state out in the open area" loading="lazy">
        </div>
        <h3>Hazed Dayz</h3>
      </div>

      <!-- Work 2: Sonder -->
      <div class="gallery-card illust-card">
        <div class="image-placeholder">
          <img src="https://i.imgur.com/DgD03nB.jpeg" alt="Magnus Stenberg and Brian Sharp share tensions" loading="lazy">
        </div>
        <h3>Sonder</h3>
      </div>

    </div>
  </section>

  <!-- Universal Footer -->
  <footer class="site-footer">
    <p class="footer-credits">© 2026 Built by yours truly</p>
  </footer>

  <!-- Script to handle light/dark logic and lightbox modal engine -->
  <script src="script.js"></script>
</body>
</html>
