<!DOCTYPE html>

  <!-- Google Fonts Link for JetBrains Mono -->
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">
  
  <!-- Core Stylesheet Connection -->
  <link rel="stylesheet" href="style.css">

  <!-- 🛠️ INJECTED LAYOUT TUNING FOR FREE-FLOWING IMAGE DUMP -->
  <style>
    /* Creates a true masonry stream layout where content flows organically */
    .illust-container {
      column-count: 2;
      column-gap: 20px;
      width: 100%;
      margin-top: 20px;
    }

    /* Target smaller screens to stack down to a single column cleanly */
    @media (max-width: 768px) {
      .illust-container {
        column-count: 1;
      }
    }

    /* Prevents the card wrapper from splitting or clipping across column seams */
    .illust-card {
      position: relative;
      display: inline-block;
      width: 100%;
      margin-bottom: 20px;
      overflow: hidden;
      border: 1px solid var(--border-color, #333);
      border-radius: 4px;
      background: transparent;
      cursor: zoom-in;
    }

    /* Allows images to maintain their exact native aspect ratios with no cropping */
    .illust-card img {
      width: 100%;
      height: auto;
      display: block;
      transition: transform 0.3s ease;
    }

    /* Scale up artwork on hover */
    .illust-card:hover img {
      transform: scale(1.02);
    }

    /* Hidden title overlay that fades up cleanly over the native canvas bounds */
    .illust-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 20px 15px 15px 15px;
      background: linear-gradient(transparent, rgba(0, 0, 0, 0.85));
      opacity: 0;
      transition: opacity 0.25s ease;
      pointer-events: none; /* Stops it from messing up click-to-zoom */
      box-sizing: border-box;
    }

    .illust-card:hover .illust-overlay {
      opacity: 1;
    }

    .illust-overlay h3 {
      margin: 0;
      padding: 0;
      color: #fff;
      font-size: 1rem;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 500;
      line-height: 1.2;
    }

    /* ========================================== */
    /* LIGHTBOX ZOOM MODAL STYLES                 */
    /* ========================================== */
    .zoom-modal {
      display: none;
      position: fixed;
      z-index: 10000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(10, 10, 12, 0.95);
      backdrop-filter: blur(8px);
      cursor: zoom-out;
    }

    .zoom-modal-content {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.95);
      max-width: 90vw;
      max-height: 85vh;
      object-fit: contain;
      transition: transform 0.25s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    .zoom-modal.show .zoom-modal-content {
      transform: translate(-50%, -50%) scale(1);
    }

    .close-zoom {
      position: absolute;
      top: 20px;
      right: 30px;
      color: #888;
      font-size: 35px;
      font-family: 'JetBrains Mono', monospace;
      cursor: pointer;
      transition: color 0.2s ease;
    }

    .close-zoom:hover {
      color: #fff;
    }
  </style>
</head>
