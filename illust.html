<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Illustrations | My Portfolio</title>
  <!-- Google Fonts Link for JetBrains Mono -->
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">
  <!-- Core Stylesheet Connection -->
  <link rel="stylesheet" href="style.css">

  <!-- 🛠️ INJECTED LAYOUT TUNING FOR FREE-FLOWING IMAGE DUMP -->
  <style>
    /* Mimics the multi-column image masonry format */
    .illust-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
      width: 100%;
      margin-top: 20px;
    }

    /* Keeps cards raw, flat, borderless, and edge-to-edge */
    .illust-card {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--border-color, #333);
      border-radius: 4px;
      line-height: 0; /* Eradicates inline image browser gaps */
      background: #111;
    }

    .illust-card img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    /* Scale up artwork on hover */
    .illust-card:hover img {
      transform: scale(1.02);
    }

    /* Hidden title overlay that drops down on hover */
    .illust-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 15px;
      background: linear-gradient(transparent, rgba(0, 0, 0, 0.85));
      opacity: 0;
      transition: opacity 0.25s ease;
      pointer-events: none; /* Stops it from messing up click-to-zoom */
      box-sizing: border-box;
    }

    .illust-card:hover .illust-overlay {
      opacity: 1;
    }

    .illust-overlay h3 {
      margin: 0;
      padding: 0;
      color: #fff;
      font-size: 1rem;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 500;
      line-height: 1.2;
    }
  </style>
</head>
<body>
  <!-- Navigation Header -->
  <header class="main-header">
    <nav class="nav-links">
      <a href="index.html">Back to Home</a>
    </nav>
    <!-- Theme Toggle Switch -->
    <div class="theme-switch-container">
      <button id="theme-toggle" aria-label="Toggle dark and light mode">
        <span class="switch-handle"></span>
      </button>
    </div>
  </header>

  <!-- Main Content Header Section -->
  <section class="portfolio-section">
    <h2>Illustrations</h2>
    <p>Polished digital and traditional media.</p>
  </section>

  <!-- ========================================== ⏳ ARCHIVE ERA: 2026 (Current) ========================================== -->
  <section class="portfolio-section" style="margin-top: 60px;">
    <h2 style="font-size: 1.4rem; border-bottom: 2px solid var(--border-color, #333); padding-bottom: 8px; margin-bottom: 24px;">
      2026 Log
    </h2>

    <h3 style="font-size: 1.1rem; color: var(--text-secondary, #888); margin-bottom: 15px; font-weight: 500;">Featured Gallery Wall</h3>
    
    <!-- 🎯 THE FREE-FLOWING COLLAGE CONTAINER -->
    <div class="illust-container">
      
      <!-- Work 1: Hazed Dayz -->
      <div class="illust-card">
        <img src="https://i.imgur.com/4g1VaDt.png" alt="Fritz Ackermann, in a day-drunken state out in the open area" class="zoomable-img" loading="lazy">
        <div class="illust-overlay">
          <h3>Hazed Dayz</h3>
        </div>
      </div>

      <!-- Work 2: Sonder -->
      <div class="illust-card">
        <img src="https://imgur.com/fd8fb195-6bf5-4c81-8446-769fb4835069" alt="Magnus Stenberg and Brian Sharp share tensions" class="zoomable-img" loading="lazy">
        <div class="illust-overlay">
          <h3>Sonder</h3>
        </div>
      </div>

    </div>
  </section>

  <!-- Universal Footer -->
  <footer class="site-footer">
    <p class="footer-credits">© 2026 Built by yours truly</p>
  </footer>

  <!-- Script to handle light/dark and lightbox logic -->
  <script src="script.js"></script>
</body>
</html>
