<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Illustrations | My Portfolio</title>
  <!-- Google Fonts Link for JetBrains Mono -->
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">
  <!-- Core Stylesheet Connection -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Navigation Header -->
  <header class="main-header">
    <nav class="nav-links">
      <a href="index.html">Back to Home</a>
    </nav>
    <!-- Theme Toggle Switch -->
    <div class="theme-switch-container">
      <button id="theme-toggle" aria-label="Toggle dark and light mode">
        <span class="switch-handle"></span>
      </button>
    </div>
  </header>

  <!-- Main Content Header Section -->
  <section class="portfolio-section">
    <h2>Illustrations</h2>
    <p>Polished digital and traditional media.</p>
  </section>

  <!-- ========================================== ⏳ ARCHIVE ERA: 2026 (Current) ========================================== -->
  <section class="portfolio-section" style="margin-top: 60px;">
    <h2 style="font-size: 1.4rem; border-bottom: 2px solid var(--border-color); padding-bottom: 8px; margin-bottom: 24px;">
      2026 Log
    </h2>

    <h3 style="font-size: 1.1rem; color: var(--text-secondary); margin-bottom: 15px; font-weight: 500;">Featured Gallery Wall</h3>
    
    <!-- 🎯 THE FREE-FLOWING COLLAGE CONTAINER -->
    <div class="illust-container">
      
      <!-- Work 1: Hazed Dayz -->
      <div class="illust-card">
        <img src="https://imgur.com" alt="Fritz Ackermann, in a day-drunken state out in the open area" class="zoomable-img" loading="lazy">
        <div class="illust-overlay">
          <h3>Hazed Dayz</h3>
        </div>
      </div>

      <!-- Work 2: Sonder -->
      <div class="illust-card">
        <img src="https://imgur.com" alt="Magnus Stenberg and Brian Sharp share tensions" class="zoomable-img" loading="lazy">
        <div class="illust-overlay">
          <h3>Sonder</h3>
        </div>
      </div>

    </div>
  </section>

  <!-- Universal Footer -->
  <footer class="site-footer">
    <p class="footer-credits">© 2026 Built by yours truly</p>
  </footer>

  <!-- Script to handle light/dark and lightbox logic -->
  <script src="script.js"></script>
</body>
</html>
